name: MLOps Automation Pipeline

on:
  push:
    branches: [main, experiment]
    paths:
      - 'src/**'
      - 'config/**'
      - 'data/processed/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even if tests pass'
        required: false
        default: 'false'
      inject_drift:
        description: 'Inject synthetic data drift for testing'
        required: false
        default: 'false'
  # LK-12: Scheduled retraining (every Sunday 02:00 WIB)
  schedule:
    - cron: '0 19 * * 0'   # 19:00 UTC = 02:00 WIB next day

env:
  PYTHON_VERSION: '3.11'
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
  MODEL_NAME: log-attack-detector

jobs:

  # ────────────────────────────────────────────────────────────
  #  Stage 1: Automated Testing (LK-08)
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

      - name: Check test coverage threshold
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0))
          print(f'Coverage: {rate*100:.1f}%')
          assert rate >= 0.60, f'Coverage {rate*100:.1f}% below 60% threshold'
          print('✅ Coverage threshold passed')
          "

  # ────────────────────────────────────────────────────────────
  #  Stage 2: Data Ingestion & Preprocessing (LK-04)
  # ────────────────────────────────────────────────────────────
  data-pipeline:
    name: 📦 Data Pipeline
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup DVC
        run: |
          pip install dvc
          dvc pull --no-run-cache || echo "DVC pull skipped (no remote configured)"

      - name: Ensure data directories
        run: |
          mkdir -p data/raw data/processed/v0.1.1

      - name: Run data ingestion
        run: |
          python src/data/ingest_data.py \
            --n-records 500 \
            --attack-ratio 0.4 \
            --hours-back 24

      - name: Run preprocessing (append mode for Continual Learning)
        run: |
          python src/data/preprocess.py --append

      - name: Track data with DVC
        run: |
          dvc add data/raw/ data/processed/ || echo "DVC add skipped"

      - name: Upload processed data artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/v0.1.1/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  #  Stage 3: Automated Training (LK-08)
  # ────────────────────────────────────────────────────────────
  train:
    name: 🤖 Model Training
    runs-on: ubuntu-latest
    needs: data-pipeline
    outputs:
      best_run_id:   ${{ steps.train.outputs.best_run_id }}
      best_f1:       ${{ steps.train.outputs.best_f1 }}
      gate_passed:   ${{ steps.train.outputs.gate_passed }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/v0.1.1/

      - name: Start MLflow server (local for CI)
        run: |
          pip install mlflow
          mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination /tmp/mlflow-artifacts \
            --host 0.0.0.0 --port 5000 &
          sleep 5
          curl -f http://localhost:5000/health && echo "MLflow started ✅"
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

      - name: Run training (all hyperparameter configs)
        id: train
        run: |
          python src/training/train.py \
            --run-all \
            --register \
            --strict
          
          # Extract best run info from summary
          python - <<'EOF'
          import json, os
          with open('mlflow_results_summary.json') as f:
              results = json.load(f)
          best = max(results, key=lambda r: r['metrics']['f1_score'])
          print(f"Best run: {best['run_id']}")
          print(f"Best F1: {best['metrics']['f1_score']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"best_run_id={best['run_id']}\n")
              fh.write(f"best_f1={best['metrics']['f1_score']}\n")
              fh.write(f"gate_passed={'true' if best['gate_passed'] else 'false'}\n")
          EOF
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

      - name: Upload training results
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: |
            mlflow_results_summary.json
            models/

  # ────────────────────────────────────────────────────────────
  #  Stage 4: Model Evaluation & Validation (LK-08)
  # ────────────────────────────────────────────────────────────
  evaluate:
    name: 📊 Model Evaluation
    runs-on: ubuntu-latest
    needs: train
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download training results
        uses: actions/download-artifact@v4
        with:
          name: training-results

      - name: Validate model performance
        id: validate
        run: |
          python - <<'EOF'
          import json, sys

          THRESHOLDS = {
              "accuracy":  0.85,
              "f1_score":  0.82,
              "precision": 0.80,
              "recall":    0.80,
          }

          with open('mlflow_results_summary.json') as f:
              results = json.load(f)

          best = max(results, key=lambda r: r['metrics']['f1_score'])
          metrics = best['metrics']

          print("📊 Model Evaluation Report")
          print("=" * 50)
          all_passed = True
          for metric, threshold in THRESHOLDS.items():
              value = metrics.get(metric, 0)
              status = "✅ PASS" if value >= threshold else "❌ FAIL"
              print(f"  {status} | {metric:<12}: {value:.4f} (min: {threshold})")
              if value < threshold:
                  all_passed = False

          if not all_passed:
              print("\n❌ Model did not meet performance thresholds. NOT promoting.")
              sys.exit(1)
          else:
              print("\n✅ All thresholds passed! Model eligible for Staging.")
          EOF

      - name: Auto-register to Staging (LK-08 Stage 4)
        id: promote
        if: |
          needs.train.outputs.gate_passed == 'true' &&
          (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        run: |
          echo "🚀 Registering model to MLflow Staging..."
          python src/training/model_registry.py \
            --action promote \
            --version 1 \
            --model-name ${{ env.MODEL_NAME }}
          echo "promoted=true" >> $GITHUB_OUTPUT
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

      - name: Generate evaluation report
        if: always()
        run: |
          python - <<'EOF'
          import json
          from datetime import datetime

          with open('mlflow_results_summary.json') as f:
              results = json.load(f)

          report = {
              "timestamp": datetime.now().isoformat(),
              "runs":      len(results),
              "results":   results,
          }
          with open('evaluation_report.json', 'w') as f:
              json.dump(report, f, indent=2)
          print("Evaluation report saved.")
          EOF

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation_report.json

  # ────────────────────────────────────────────────────────────
  #  Stage 5: Continuous Training Check (LK-12)
  # ────────────────────────────────────────────────────────────
  continuous-training-check:
    name: 🔄 CT Check (Drift & Triggers)
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.event_name == 'schedule' || github.event.inputs.inject_drift == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/v0.1.1/

      - name: Run CT pipeline (dry-run)
        run: |
          INJECT_FLAG=""
          if [ "${{ github.event.inputs.inject_drift }}" = "true" ]; then
            INJECT_FLAG="--inject-drift"
          fi
          python src/monitoring/continuous_training.py \
            --dry-run \
            $INJECT_FLAG
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

      - name: Upload CT report
        uses: actions/upload-artifact@v4
        with:
          name: ct-report
          path: data/ct_report.json
